<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no, viewport-fit=cover" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black" name="apple-mobile-web-app-status-bar-style" />
    <meta content="telephone=no" name="format-detection" />
    <title>❤️ 生日快乐，我的宝贝 ❤️</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        img {
            -webkit-touch-callout: none;
            pointer-events: none;
        }
        .slide {
            pointer-events: auto;
        }

        :root {
            --rose: #ff6b81;
            --rose-light: #ff9a9e;
            --gold: #f9d56e;
            --pink-glow: #fbc2eb;
            --deep-rose: #ff4757;
            --card-bg: rgba(255, 240, 245, 0.25);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --card-radius: 48px;
            --border-offset: -2px;
            --card-shadow-glow: 0 0 100px rgba(255, 107, 129, 0.12);
            --card-shadow-glow-strong: 0 0 130px rgba(255, 107, 129, 0.2);
        }

        body {
            min-height: 100vh;
            background: #0a0010;
            font-family: 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
            position: relative;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        /* ===== 音乐状态提示条 ===== */
        .music-toast {
            position: fixed;
            top: calc(20px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 10px 22px;
            color: #fff;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            z-index: 9998;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
            max-width: calc(100vw - 40px);
        }
        .music-toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .music-toast .icon {
            font-size: 1.2rem;
            animation: musicIconPulse 1.5s ease-in-out infinite;
        }
        @keyframes musicIconPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
        .music-toast .tap-hint {
            animation: tapHintBlink 1s ease-in-out infinite;
        }
        @keyframes tapHintBlink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ===== 星空背景画布 ===== */
        #starsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 玫瑰花瓣容器 ===== */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            top: -60px;
            pointer-events: none;
            animation: petalFall linear forwards;
            filter: drop-shadow(0 0 6px rgba(255, 107, 129, 0.4));
        }
        @keyframes petalFall {
            0% {
                transform: translateY(-5vh) rotate(0deg) rotateY(0deg) scale(1);
                opacity: 0;
            }
            3% {
                opacity: 0.85;
            }
            30% {
                transform: translateY(30vh) rotate(120deg) rotateY(180deg) scale(1.1);
                opacity: 0.8;
            }
            60% {
                transform: translateY(60vh) rotate(250deg) rotateY(0deg) scale(0.9);
                opacity: 0.55;
            }
            100% {
                transform: translateY(105vh) rotate(400deg) rotateY(360deg) scale(0.4);
                opacity: 0;
            }
        }

        /* ===== 点击爱心特效 ===== */
        .click-heart {
            position: fixed;
            pointer-events: none;
            z-index: 998;
            animation: clickHeartPop 1.2s ease-out forwards;
            font-size: 28px;
            filter: drop-shadow(0 0 12px rgba(255, 71, 87, 0.7));
        }
        @keyframes clickHeartPop {
            0% {
                transform: translate(0, 0) scale(0.3) rotate(0deg);
                opacity: 1;
            }
            40% {
                transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(var(--rot));
                opacity: 0.9;
            }
            100% {
                transform: translate(calc(var(--dx) * 2.2), calc(var(--dy) * 2.2)) scale(0.15) rotate(calc(var(--rot) * 1.6));
                opacity: 0;
            }
        }

        /* ===== 开场动画遮罩 ===== */
        #introOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a0a1a, #050010);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 1.8s ease;
        }
        #introOverlay.hide {
            opacity: 0;
            pointer-events: none;
        }
        #introCanvas {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        #introProgress {
            position: absolute;
            bottom: calc(40px + var(--safe-bottom));
            color: rgba(255, 220, 240, 0.6);
            font-size: 0.95rem;
            letter-spacing: 3px;
            font-weight: 300;
            text-shadow: 0 0 18px rgba(255, 107, 129, 0.5), 0 0 36px rgba(255, 154, 158, 0.3);
            z-index: 2;
            animation: introPulse 1.8s ease-in-out infinite;
        }
        @keyframes introPulse {
            0%,
            100% {
                opacity: 0.5;
                letter-spacing: 3px;
            }
            50% {
                opacity: 1;
                letter-spacing: 6px;
            }
        }

        /* ===== 主卡片 ===== */
        .birthday-card {
            max-width: 1300px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: var(--card-radius);
            padding: 24px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.25),
                inset 0 0 80px rgba(255, 182, 193, 0.08),
                var(--card-shadow-glow);
            z-index: 2;
            transition: opacity 1.5s ease, transform 0.6s ease;
            opacity: 0;
            position: relative;
            animation: cardGlow 4s ease-in-out infinite;
            margin: 0 auto;
            overflow: visible;
        }
        @keyframes cardGlow {
            0%,
            100% {
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.25), 0 0 80px rgba(255, 107, 129, 0.08);
            }
            50% {
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.35), var(--card-shadow-glow-strong);
            }
        }
        .birthday-card::before {
            content: '';
            position: absolute;
            top: var(--border-offset);
            left: var(--border-offset);
            right: var(--border-offset);
            bottom: var(--border-offset);
            border-radius: calc(var(--card-radius) - var(--border-offset));
            background: linear-gradient(45deg,
                    transparent 30%,
                    rgba(255, 154, 158, 0.5) 45%,
                    rgba(251, 194, 235, 0.6) 50%,
                    rgba(255, 154, 158, 0.5) 55%,
                    transparent 70%);
            background-size: 300% 300%;
            animation: borderSweep 5s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }
        @keyframes borderSweep {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* 主标题 */
        .main-title {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(45deg,
                    #ff6b81, #ff9a9e, #fbc2eb, #ffd1d1,
                    #ff6b81, #ff9a9e, #fbc2eb);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3.5s ease-in-out infinite, titleHeartbeat 1.6s ease-in-out infinite;
            margin-bottom: 20px;
            letter-spacing: 3px;
            padding: 0 4px;
            filter: drop-shadow(0 0 18px rgba(255, 107, 129, 0.4));
            word-break: break-word;
        }
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        @keyframes titleHeartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            8% {
                transform: scale(1.06);
            }
            16% {
                transform: scale(1);
            }
            24% {
                transform: scale(1.04);
            }
            32% {
                transform: scale(1);
            }
        }

        /* 网格布局 */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 0.9fr;
            gap: 20px;
            align-items: center;
        }

        /* ===== 照片轮播 ===== */
        .photo-slider {
            background: rgba(255, 245, 248, 0.45);
            border-radius: 32px;
            padding: 16px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.12), inset 0 0 40px rgba(255, 200, 210, 0.2);
            position: relative;
            overflow: hidden;
        }
        .photo-slider::after {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(ellipse at center,
                    rgba(255, 255, 255, 0.15) 0%,
                    transparent 70%);
            pointer-events: none;
            animation: shimmer 3.5s ease-in-out infinite;
            z-index: 1;
            border-radius: 32px;
        }
        @keyframes shimmer {
            0%,
            100% {
                transform: translate(-10%, -10%);
                opacity: 0.3;
            }
            50% {
                transform: translate(10%, 10%);
                opacity: 0.7;
            }
        }
        .slider-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 24px;
            overflow: hidden;
            background: #f5e6e8;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18), 0 0 0 3px rgba(255, 255, 255, 0.4);
            z-index: 2;
        }
        .slider-images {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 24px;
            object-fit: cover;
            transform: scale(0.94);
            -webkit-touch-callout: none;
        }
        .slide.active {
            opacity: 1;
            transform: scale(1);
        }

        /* 轮播按钮 */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            color: #ff6b81;
            transition: all 0.3s;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15), 0 0 20px rgba(255, 107, 129, 0.2);
            z-index: 10;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            touch-action: manipulation;
        }
        .slider-btn:active {
            transform: translateY(-50%) scale(0.9);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2), 0 0 30px rgba(255, 107, 129, 0.4);
        }
        .slider-btn.prev {
            left: 8px;
        }
        .slider-btn.next {
            right: 8px;
        }

        /* 指示点 */
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
            z-index: 3;
            position: relative;
        }
        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        .dot.active {
            width: 28px;
            border-radius: 7px;
            background: #ff4757;
            box-shadow: 0 0 16px rgba(255, 71, 87, 0.5), 0 0 28px rgba(255, 107, 129, 0.3);
        }

        /* ===== 右侧情话 ===== */
        .love-quotes {
            background: rgba(255, 248, 245, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 32px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.1), inset 0 0 50px rgba(255, 200, 210, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .love-quotes::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%,
                    rgba(255, 182, 193, 0.2) 0%,
                    transparent 50%),
                radial-gradient(circle at 70% 60%,
                    rgba(255, 218, 185, 0.15) 0%,
                    transparent 50%);
            pointer-events: none;
            animation: quoteGlow 6s ease-in-out infinite;
            border-radius: 32px;
        }
        @keyframes quoteGlow {
            0%,
            100% {
                transform: translate(0, 0);
            }
            33% {
                transform: translate(3%, -2%);
            }
            66% {
                transform: translate(-2%, 3%);
            }
        }
        .quote-icon {
            font-size: 44px;
            margin-bottom: 18px;
            opacity: 0.75;
            position: relative;
            z-index: 1;
            animation: iconFloat 3s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .quote-text {
            font-size: 1.35rem;
            line-height: 1.6;
            color: #2c3e50;
            font-weight: 500;
            letter-spacing: 1.5px;
            transition: opacity 0.35s ease;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.6);
            word-break: break-word;
        }
        .quote-text.typing {
            border-right: 2px solid #ff6b81;
            animation: cursorBlink 0.7s step-end infinite;
        }
        @keyframes cursorBlink {
            0%,
            100% {
                border-color: #ff6b81;
            }
            50% {
                border-color: transparent;
            }
        }
        .quote-author {
            margin-top: 26px;
            font-size: 0.95rem;
            color: #ff6b81;
            font-weight: 600;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        /* ===== 音乐进度条 ===== */
        .music-control {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        .progress-container {
            flex: 1;
            min-width: 100px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 107, 129, 0.3);
            outline: none;
            cursor: pointer;
            touch-action: none;
            transition: background 0.3s;
        }
        .progress-bar:hover {
            background: rgba(255, 107, 129, 0.5);
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b81;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(255, 107, 129, 0.5), 0 3px 10px rgba(0, 0, 0, 0.2);
            touch-action: none;
            border: 3px solid #fff;
        }
        .progress-bar::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b81;
            cursor: pointer;
            border: 3px solid #fff;
            touch-action: none;
            box-shadow: 0 0 14px rgba(255, 107, 129, 0.5);
        }
        .time-display {
            font-size: 0.7rem;
            color: #888;
            white-space: nowrap;
            min-width: 70px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        /* ===== 爱心粒子画布 ===== */
        .heart-canvas-wrapper {
            margin-top: 26px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 22px;
        }
        #heartCanvas {
            max-width: 100%;
            border-radius: 22px;
            background: rgba(255, 240, 245, 0.35);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1), inset 0 0 40px rgba(255, 200, 210, 0.3);
        }

        /* ===== 终极烟花层 ===== */
        .final-animation-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.6s ease;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            overflow: hidden;
        }
        .final-animation-layer.show {
            opacity: 1;
            visibility: visible;
        }
        .final-blessing {
            text-align: center;
            z-index: 1001;
            color: white;
            padding: 24px;
            animation: blessingAppear 0.8s ease-out;
            max-width: 90%;
        }
        @keyframes blessingAppear {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            60% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .final-blessing h1 {
            font-size: 2.2rem;
            margin-bottom: 18px;
            text-shadow: 0 0 24px rgba(255, 107, 129, 0.9), 0 0 50px rgba(255, 71, 87, 0.6), 0 0 80px rgba(255, 154, 158, 0.4);
            animation: glowPulse 1.5s infinite;
            letter-spacing: 3px;
            word-break: break-word;
        }
        .final-blessing p {
            font-size: 1.15rem;
            letter-spacing: 2.5px;
            line-height: 1.7;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
            word-break: break-word;
        }
        @keyframes glowPulse {
            0%,
            100% {
                text-shadow: 0 0 24px #ff6b81, 0 0 50px #ff4757;
            }
            50% {
                text-shadow: 0 0 45px #ff6b81, 0 0 75px #ff4757, 0 0 100px #ff9a9e;
            }
        }
        .close-final {
            margin-top: 36px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            touch-action: manipulation;
            box-shadow: 0 8px 24px rgba(255, 71, 87, 0.4), 0 0 40px rgba(255, 107, 129, 0.3);
            letter-spacing: 2px;
            word-break: keep-all;
        }
        .close-final:active {
            transform: scale(0.94);
            box-shadow: 0 4px 14px rgba(255, 71, 87, 0.5);
        }

        /* ===== 背景浮动爱心 ===== */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .heart-bg {
            position: absolute;
            font-size: 20px;
            opacity: 0.35;
            animation: floatHeart 9s ease-in-out infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(255, 150, 170, 0.5));
        }
        @keyframes floatHeart {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            8% {
                opacity: 0.35;
                transform: translateY(85vh) rotate(30deg) scale(1);
            }
            85% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-25vh) rotate(380deg) scale(0.3);
                opacity: 0;
            }
        }

        /* ===== 响应式（iPhone 17 Pro / 17 及各种手机） ===== */
        @media (max-width: 768px) {
            :root {
                --card-radius: 36px;
                --border-offset: -1px;
                --card-shadow-glow: 0 0 40px rgba(255, 107, 129, 0.08);
                --card-shadow-glow-strong: 0 0 60px rgba(255, 107, 129, 0.12);
            }

<body>

    <script>
        /* ================================================================
           华丽浪漫版 - 生日祝福页面（修复移动端溢出 + 音乐播放）
           ================================================================ */
        (function() {
            'use strict';

            // ============================================================
            // 配置项
            // ============================================================
            const CONFIG = {
                musicFile: 'a_thousand_years.mp3',
                photos: [
                    'photo1.jpg', 'photo2.jpg', 'photo3.jpg', 'photo4.jpg', 'photo5.jpg',
                    'photo6.jpg', 'photo7.jpg', 'photo8.jpg', 'photo9.jpg', 'photo10.jpg',
                    'photo11.jpg', 'photo12.jpg', 'photo13.jpg', 'photo14.jpg'
                ],
                quotes: [
                    '💕 我们的故事，从那一刻开始，就注定浪漫',
                    '🌟 你的微笑是全世界最美的风景',
                    '🎀 你让平凡的日子都闪着光',
                    '🍬 你比糖果还要甜，比阳光还要暖',
                    '✨ 遇见你是我最大的幸运',
                    '💖 和你在一起的每个瞬间都值得珍藏',
                    '🌸 你是我心动的唯一理由',
                    '🌈 世界万物，你是我的欢喜',
                    '🌹 和你一起，连空气都是甜的',
                    '🍁 所有的美好，都与你有关',
                    '🌟 我的世界因你而完整',
                    '🎈 你是心动，是偏爱，是例外',
                    '💝 爱你这件事，我从未动摇',
                    '🎂 宝贝，生日快乐，今天你是全世界最幸福的女孩'
                ],
                introTexts: ['生', '日', '快', '乐', '🎂'],
                particleCount: 600,
                autoSlide: false
            };

            // ============================================================
            // DOM 引用
            // ============================================================
            const $ = (id) => document.getElementById(id);
            const dom = {
                starsCanvas: $('starsCanvas'),
                petalsContainer: $('petalsContainer'),
                introOverlay: $('introOverlay'),
                introCanvas: $('introCanvas'),
                introProgress: $('introProgress'),
                mainCard: $('mainCard'),
                sliderImages: $('sliderImages'),
                sliderDots: $('sliderDots'),
                prevBtn: $('prevBtn'),
                nextBtn: $('nextBtn'),
                quoteText: $('quoteText'),
                musicProgress: $('musicProgress'),
                timeDisplay: $('timeDisplay'),
                heartCanvas: $('heartCanvas'),
                finalLayer: $('finalLayer'),
                fireworkCanvas: $('fireworkCanvas'),
                floatingHearts: $('floatingHearts'),
                musicToast: $('musicToast'),
            };

            // ============================================================
            // 工具函数
            // ============================================================
            function formatTime(seconds) {
                if (!seconds || !isFinite(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            const isWechat = /MicroMessenger/i.test(navigator.userAgent);
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
            const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);

            // ============================================================
            // 0. 星空背景
            // ============================================================
            (function initStars() {
                const canvas = dom.starsCanvas;
                const ctx = canvas.getContext('2d');
                let W, H;
                const stars = [];
                const STAR_COUNT = 180;

                function resize() {
                    W = window.innerWidth;
                    H = window.innerHeight;
                    canvas.width = W;
                    canvas.height = H;
                }
                resize();
                window.addEventListener('resize', () => {
                    resize();
                    initStarData();
                });

                function initStarData() {
                    stars.length = 0;
                    for (let i = 0; i < STAR_COUNT; i++) {
                        stars.push({
                            x: Math.random() * W,
                            y: Math.random() * H,
                            r: 0.4 + Math.random() * 2.2,
                            twinkleSpeed: 0.005 + Math.random() * 0.03,
                            twinkleOffset: Math.random() * Math.PI * 2,
                            baseAlpha: 0.3 + Math.random() * 0.7,
                            color: Math.random() < 0.15 ?
                                `hsl(${Math.random() * 30 + 340}, 80%, ${70 + Math.random() * 25}%)` :
                                `hsl(${Math.random() * 60 + 200}, 30%, ${75 + Math.random() * 20}%)`,
                        });
                    }
                }
                initStarData();

                let shootingStars = [];

                function spawnShootingStar() {
                    if (Math.random() < 0.015 && shootingStars.length < 2) {
                        shootingStars.push({
                            x: Math.random() * W * 0.8,
                            y: Math.random() * H * 0.3,
                            vx: 3 + Math.random() * 6,
                            vy: 2 + Math.random() * 4,
                            life: 1,
                            length: 40 + Math.random() * 80,
                        });
                    }
                }

                function animateStars(timestamp) {
                    ctx.clearRect(0, 0, W, H);
                    for (const s of stars) {
                        const alpha = s.baseAlpha * (0.55 + 0.45 * Math.sin(timestamp * s.twinkleSpeed + s
                            .twinkleOffset));
                        ctx.fillStyle = s.color;
                        ctx.globalAlpha = alpha;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fill();
                        if (s.r > 1.5 && alpha > 0.7) {
                            ctx.globalAlpha = alpha * 0.25;
                            ctx.beginPath();
                            ctx.arc(s.x, s.y, s.r * 3.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    spawnShootingStar();
                    for (let i = shootingStars.length - 1; i >= 0; i--) {
                        const ss = shootingStars[i];
                        ss.x += ss.vx;
                        ss.y += ss.vy;
                        ss.life -= 0.018;
                        if (ss.life <= 0) {
                            shootingStars.splice(i, 1);
                            continue;
                        }
                        const grad = ctx.createLinearGradient(
                            ss.x, ss.y,
                            ss.x - ss.vx * ss.length / 5, ss.y - ss.vy * ss.length / 5
                        );
                        grad.addColorStop(0, `rgba(255,255,255,${ss.life})`);
                        grad.addColorStop(1, 'rgba(255,255,255,0)');
                        ctx.strokeStyle = grad;
                        ctx.lineWidth = 1.8;
                        ctx.globalAlpha = ss.life;
                        ctx.beginPath();
                        ctx.moveTo(ss.x, ss.y);
                        ctx.lineTo(ss.x - ss.vx * ss.length / 5, ss.y - ss.vy * ss.length / 5);
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                    requestAnimationFrame(animateStars);
                }
                requestAnimationFrame(animateStars);
            })();

            // ============================================================
            // 0.5 玫瑰花瓣飘落
            // ============================================================
            (function initPetals() {
                const container = dom.petalsContainer;
                const petalShapes = ['🌸', '🌷', '💮', '🏵️', '🌺', '✿', '❀', '🌹'];

                function createPetal() {
                    const petal = document.createElement('span');
                    petal.className = 'petal';
                    petal.textContent = petalShapes[Math.floor(Math.random() * petalShapes.length)];
                    petal.style.left = Math.random() * 96 + '%';
                    petal.style.fontSize = (18 + Math.random() * 28) + 'px';
                    petal.style.animationDuration = (7 + Math.random() * 11) + 's';
                    petal.style.animationDelay = '0s';
                    petal.style.opacity = (0.5 + Math.random() * 0.45);
                    petal.style.setProperty('--sway', (Math.random() - 0.5) * 120 + 'px');
                    petal.style.animation =
                        `petalFall ${7 + Math.random() * 11}s linear forwards, petalSway ${2 + Math.random() * 3}s ease-in-out infinite`;
                    container.appendChild(petal);
                    setTimeout(() => petal.remove(), 14000);
                }

                const swayStyle = document.createElement('style');
                swayStyle.textContent = `
                    @keyframes petalSway {
                        0%,100% { margin-left: 0; }
                        25% { margin-left: var(--sway); }
                        75% { margin-left: calc(var(--sway) * -0.7); }
                    }
                `;
                document.head.appendChild(swayStyle);

                for (let i = 0; i < 10; i++) {
                    setTimeout(() => createPetal(), i * 400);
                }
                setInterval(() => {
                    if (container.children.length < 18) createPetal();
                }, 900);
            })();

            // ============================================================
            // 0.8 点击爱心特效
            // ============================================================
            (function initClickHearts() {
                const heartEmojis = ['❤️', '💖', '💗', '💓', '💕', '💝', '💘', '✨', '💞'];

                function spawnClickHeart(x, y) {
                    const count = 3 + Math.floor(Math.random() * 5);
                    for (let i = 0; i < count; i++) {
                        const el = document.createElement('span');
                        el.className = 'click-heart';
                        el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                        el.style.left = x + 'px';
                        el.style.top = y + 'px';
                        el.style.fontSize = (20 + Math.random() * 22) + 'px';
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 40 + Math.random() * 80;
                        el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                        el.style.setProperty('--dy', Math.sin(angle) * dist - 30 - Math.random() * 50 + 'px');
                        el.style.setProperty('--rot', (Math.random() - 0.5) * 180 + 'deg');
                        el.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
                        document.body.appendChild(el);
                        setTimeout(() => el.remove(), 1400);
                    }
                }

                function handleInteraction(e) {
                    if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.dot'))
                        return;
                    if (dom.finalLayer.classList.contains('show')) return;
                    const clientX = e.clientX || (e.touches && e.touches[0]?.clientX) || 0;
                    const clientY = e.clientY || (e.touches && e.touches[0]?.clientY) || 0;
                    if (clientX === 0 && clientY === 0) return;
                    spawnClickHeart(clientX, clientY);
                    musicManager.tryPlay();
                }

                document.addEventListener('click', handleInteraction);
                document.addEventListener('touchstart', handleInteraction, { passive: true });
            })();

            // ============================================================
            // 音乐管理模块
            // ============================================================
            const musicManager = (function() {
                let audio = null;
                let ready = false;
                let playing = false;
                let playAttempted = false;
                let audioUnlocked = false;

                function showMusicToast(message, icon, duration = 3000) {
                    const toast = dom.musicToast;
                    const textEl = toast.querySelector('.text');
                    const iconEl = toast.querySelector('.icon');
                    const hintEl = toast.querySelector('.tap-hint');
                    iconEl.textContent = icon || '🎵';
                    textEl.textContent = message;
                    if (message.includes('点击') || message.includes('轻触')) {
                        hintEl.style.display = 'inline';
                    } else {
                        hintEl.style.display = 'none';
                    }
                    toast.classList.add('show');
                    if (duration > 0) {
                        clearTimeout(toast._hideTimeout);
                        toast._hideTimeout = setTimeout(() => {
                            toast.classList.remove('show');
                        }, duration);
                    }
                }

                function hideMusicToast() {
                    dom.musicToast.classList.remove('show');
                }

                function init() {
                    if (audio) return audio;
                    audio = document.createElement('audio');
                    audio.id = 'bgMusic';
                    audio.loop = true;
                    audio.preload = 'auto';
                    audio.src = encodeURI(CONFIG.musicFile);
                    audio.volume = 0.7;
                    document.body.appendChild(audio);

                    audio.addEventListener('canplaythrough', () => {
                        ready = true;
                        console.log('✅ 音频已就绪');
                        if (playAttempted && !playing) {
                            attemptPlay();
                        }
                    });
                    audio.addEventListener('loadedmetadata', () => {
                        if (audio.duration && isFinite(audio.duration)) {
                            updateTimeDisplay(0, audio.duration);
                        }
                    });
                    audio.addEventListener('timeupdate', () => {
                        if (!isSeeking && audio.duration && isFinite(audio.duration)) {
                            const progress = (audio.currentTime / audio.duration) * 100;
                            dom.musicProgress.value = progress;
                            updateTimeDisplay(audio.currentTime, audio.duration);
                        }
                    });
                    audio.addEventListener('play', () => {
                        playing = true;
                        console.log('🎵 音乐开始播放');
                        showMusicToast('浪漫音乐已响起 💖', '🎶', 2500);
                        setTimeout(hideMusicToast, 3000);
                    });
                    audio.addEventListener('pause', () => { playing = false; });
                    audio.addEventListener('error', () => {
                        console.warn('⚠️ 音乐加载失败');
                        showMusicToast('音乐文件加载失败，请检查文件', '⚠️', 5000);
                    });
                    audio.load();

                    if (isWechat) {
                        setupWechatAudio();
                    }
                    return audio;
                }

                function setupWechatAudio() {
                    if (typeof WeixinJSBridge !== 'undefined') {
                        WeixinJSBridge.invoke('getNetworkType', {}, function() {
                            if (audio && ready) {
                                audio.play().then(() => {
                                    audio.pause();
                                    audio.currentTime = 0;
                                    playing = false;
                                    audioUnlocked = true;
                                    console.log('✅ 微信音频通道已解锁');
                                }).catch(() => {});
                            }
                        });
                    }
                    document.addEventListener('WeixinJSBridgeReady', function() {
                        WeixinJSBridge.invoke('getNetworkType', {}, function() {
                            if (audio && ready) {
                                audio.play().then(() => {
                                    audio.pause();
                                    audio.currentTime = 0;
                                    playing = false;
                                    audioUnlocked = true;
                                }).catch(() => {});
                            }
                        });
                    }, false);
                    document.addEventListener('visibilitychange', function() {
                        if (!document.hidden && playAttempted && !playing && audio && ready) {
                            attemptPlay();
                        }
                    });
                }

                function attemptPlay() {
                    if (!audio) {
                        init();
                        audio = document.querySelector('#bgMusic') || init();
                    }
                    if (!audio) return;
                    playAttempted = true;
                    if (playing) return;
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            playing = true;
                            audioUnlocked = true;
                            hideMusicToast();
                        }).catch((err) => {
                            playing = false;
                            if (err.name === 'NotAllowedError') {
                                if (isWechat) {
                                    showMusicToast('轻触屏幕或滑动照片播放音乐 🎵', '🎵', 0);
                                } else if (isIOS) {
                                    showMusicToast('轻触屏幕任意位置播放音乐 🎵', '🎵', 0);
                                } else {
                                    showMusicToast('点击屏幕开始播放音乐 🎵', '🎵', 0);
                                }
                            }
                            if (isIOS && !audioUnlocked) {
                                unlockIOSAudio();
                            }
                        });
                    }
                }

                function unlockIOSAudio() {
                    const unlockHandler = function() {
                        if (audioUnlocked) {
                            document.removeEventListener('touchstart', unlockHandler);
                            document.removeEventListener('click', unlockHandler);
                            return;
                        }
                        if (audio && ready) {
                            audio.play().then(() => {
                                audio.pause();
                                audio.currentTime = 0;
                                playing = false;
                                audioUnlocked = true;
                                document.removeEventListener('touchstart', unlockHandler);
                                document.removeEventListener('click', unlockHandler);
                                setTimeout(() => attemptPlay(), 100);
                            }).catch(() => {});
                        }
                    };
                    document.addEventListener('touchstart', unlockHandler, { once: false, passive: true });
                    document.addEventListener('click', unlockHandler, { once: false });
                }

                function tryPlay() {
                    if (playing) return;
                    if (!audio || !ready) {
                        init();

                    });

            function typewriterEffect(text, element, speed = 35) {
                if (typingTimeout) clearTimeout(typingTimeout);
                element.classList.add('typing');
                element.textContent = '';
                let i = 0;

                function type() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                        typingTimeout = setTimeout(type, speed);
                    } else {
                        element.classList.remove('typing');
                        typingTimeout = null;
                    }
                }
                type();

            function updateSlide(index, useTypewriter = false) {
                const slides = dom.sliderImages.querySelectorAll('.slide');
                slides.forEach((el, i) => el.classList.toggle('active', i === index));
                const dots = dom.sliderDots.querySelectorAll('.dot');
                dots.forEach((el, i) => el.classList.toggle('active', i === index));
                if (CONFIG.quotes[index]) {
                    if (useTypewriter && index !== 0) {
                        typewriterEffect(CONFIG.quotes[index], dom.quoteText);
                    } else {
                        if (typingTimeout) clearTimeout(typingTimeout);
                        dom.quoteText.classList.remove('typing');
                        dom.quoteText.style.opacity = '0';

            // ============================================================
            // 3. 主页面爱心粒子
            // ============================================================
            (function initHeartParticles() {
                const canvas = dom.heartCanvas;
                const ctx = canvas.getContext('2d');
                let w, h;

                function resize() {
                    const rect = canvas.parentElement.getBoundingClientRect();
                    w = Math.min(rect.width * 0.9, 500);
                    h = w * 0.75;
                    canvas.width = w;
                    canvas.height = h;
                }
                resize();
                window.addEventListener('resize', resize);

                class Particle {
                    constructor(x, y, vx, vy, size, alpha, hue) {
                        this.x = x;
                        this.y = y;
                        this.vx = vx;
                        this.vy = vy;
                        this.size = size;
                        this.alpha = alpha;
                        this.gravity = 0.04;
                        this.hue = hue || 350 + Math.random() * 20;
                    }
                    update() {
                        this.x += this.vx;
                        this.y += this.vy;
                        this.vy += this.gravity;
                        this.alpha -= 0.007;
                        this.hue += 0.3;
                        return this.alpha > 0;
                    }
                    draw(ctx, timestamp) {
                        ctx.save();
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = `hsla(${this.hue}, 80%, 65%, 0.5)`;
                        ctx.globalAlpha = this.alpha;
                        ctx.fillStyle =
                            `hsl(${this.hue}, 80%, ${60 + Math.sin(timestamp * 0.005 + this.x) * 10}%)`;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = this.alpha * 0.7;
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                let particles = [];
                let heartPoints = [];

                function generateHeartPoints() {
                    const pts = [];
                    const scale = Math.min(w, h) * 0.4;
                    const cx = w / 2,
                        cy = h / 2 - 6;
                    for (let t = 0; t <= Math.PI * 2; t += 0.06) {
                        const x = 16 * Math.pow(Math.sin(t), 3);
                        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                        pts.push({ x: cx + x * scale / 16, y: cy - y * scale / 16 });
                    }
                    return pts;
                }

                function initParticles() {
                    heartPoints = generateHeartPoints();
                    for (let i = 0; i < 450; i++) {
                        const base = heartPoints[Math.floor(Math.random() * heartPoints.length)];
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 0.5 + Math.random() * 1.4;
                        particles.push(new Particle(
                            base.x, base.y,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed - 1.0,
                            1.8 + Math.random() * 4.5,
                            0.9,
                            345 + Math.random() * 25
                        ));
                    }
                }

                function animate(timestamp) {
                    ctx.clearRect(0, 0, w, h);
                    ctx.save();
                    ctx.globalAlpha = 0.15 + 0.06 * Math.sin(timestamp * 0.002);
                    ctx.fillStyle = '#ffb0c0';
                    ctx.beginPath();
                    if (heartPoints.length > 0) {
                        ctx.moveTo(heartPoints[0].x, heartPoints[0].y);
                        for (let i = 1; i < heartPoints.length; i++) {
                            ctx.lineTo(heartPoints[i].x, heartPoints[i].y);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.shadowBlur = 30;
                        ctx.shadowColor = '#ff8090';
                        ctx.fill();
                    }
                    ctx.restore();

                    for (let i = particles.length - 1; i >= 0; i--) {
                        if (!particles[i].update()) {
                            const base = heartPoints[Math.floor(Math.random() * heartPoints.length)];
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 0.4 + Math.random() * 1.1;
                            particles[i] = new Particle(
                                base.x, base.y,
                                Math.cos(angle) * speed,
                                Math.sin(angle) * speed - 0.7,
                                1.6 + Math.random() * 4,
                                0.85,
                                345 + Math.random() * 25
                            );
                        }
                        particles[i].draw(ctx, timestamp);
                    }
                    requestAnimationFrame(animate);
                }

                initParticles();
                requestAnimationFrame(animate);
            })();

            // ============================================================
            // 4. 开场动画
            // ============================================================
            (function initIntro() {
                const canvas = dom.introCanvas;
                const ctx = canvas.getContext('2d');
                let W, H;

                function resize() {
                    W = window.innerWidth;
                    H = window.innerHeight;
                    canvas.width = W;
                    canvas.height = H;
                }
                resize();
                window.addEventListener('resize', resize);

                const texts = CONFIG.introTexts;
                const TOTAL = CONFIG.particleCount;
                let particles = [];
                let targetPoints = [];
                let currentPhase = 0;
                let phaseFinished = false;
                let animId = null;
                let introDone = false;
                let sparkles = [];

                function getTextPoints(text, fontSize) {
                    const offscreen = document.createElement('canvas');
                    const offCtx = offscreen.getContext('2d');
                    const w = W * 0.9,
                        h = H * 0.8;
                    offscreen.width = w;
                    offscreen.height = h;
                    offCtx.fillStyle = '#000';
                    offCtx.fillRect(0, 0, w, h);
                    offCtx.textAlign = 'center';
                    offCtx.textBaseline = 'middle';
                    offCtx.font = `bold ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
                    offCtx.fillStyle = '#fff';
                    offCtx.fillText(text, w / 2, h / 2);
                    const imageData = offCtx.getImageData(0, 0, w, h);
                    const data = imageData.data;
                    const pts = [];
                    const step = 3;
                    for (let y = 0; y < h; y += step) {
                        for (let x = 0; x < w; x += step) {
                            const idx = (y * w + x) * 4;
                            if (data[idx] > 128) {
                                pts.push({
                                    x: x * (W / w),
                                    y: y * (H / h)
                                });
                            }
                        }
                    }
                    return pts;
                }

                function initParticles() {
                    particles = [];
                    sparkles = [];
                    for (let i = 0; i < TOTAL; i++) {
                        particles.push({
                            x: Math.random() * W,
                            y: Math.random() * H,
                            targetX: 0,
                            targetY: 0,
                            color: `hsl(${Math.random() * 40 + 340}, ${70 + Math.random() * 30}%, ${55 + Math.random() * 35}%)`,
                            size: 2 + Math.random() * 5,
                            trail: []
                        });
                    }
                    for (let i = 0; i < 40; i++) {
                        sparkles.push({
                            x: Math.random() * W,
                            y: Math.random() * H,
                            size: 0.5 + Math.random() * 2,
                            alpha: Math.random(),
                            speed: 0.01 + Math.random() * 0.03,
                            phase: Math.random() * Math.PI * 2,
                        });
                    }
                }

                function setPhaseTargets(phaseIndex) {
                    const text = texts[phaseIndex];
                    let fontSize = Math.min(W, H) * 0.38;
                    if (text === '🎂') fontSize *= 0.75;
                    const pts = getTextPoints(text, fontSize);
                    if (pts.length === 0) {
                        for (let i = 0; i < TOTAL; i++) {
                            pts.push({
                                x: W / 2 + (Math.random() - 0.5) * W * 0.5,
                                y: H / 2 + (Math.random() - 0.5) * H * 0.5
                            });
                        }
                    }
                    targetPoints = pts;
                    for (let p of particles) {
                        const idx = Math.floor(Math.random() * targetPoints.length);
                        const t = targetPoints[idx];
                        p.targetX = t.x;
                        p.targetY = t.y;
                    }
                    phaseFinished = false;
                }

                function updateParticles() {
                    let allReached = true;
                    for (let p of particles) {
                        const dx = p.targetX - p.x;
                        const dy = p.targetY - p.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 0.5) {
                            allReached = false;
                            const speed = Math.min(dist, 0.07 * dist + 0.35);
                            p.x += (dx / dist) * speed;
                            p.y += (dy / dist) * speed;
                            p.x += (Math.random() - 0.5) * 0.25;
                            p.y += (Math.random() - 0.5) * 0.25;
                        }
                        p.trail.push({ x: p.x, y: p.y });
                        if (p.trail.length > 8) p.trail.shift();
                    }
                    for (let s of sparkles) {
                        s.alpha += s.speed * (Math.sin(Date.now() * 0.003 + s.phase) > 0 ? 1 : -1);
                        s.alpha = Math.max(0.05, Math.min(0.9, s.alpha));
                    }
                    if (allReached) phaseFinished = true;
                }

                function draw(timestamp) {
                    ctx.clearRect(0, 0, W, H);
                    const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.85);
                    grad.addColorStop(0, '#2a1428');
                    grad.addColorStop(0.5, '#150a18');
                    grad.addColorStop(1, '#050010');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, H);

                    for (let p of particles) {
                        if (p.trail.length > 1) {
                            for (let i = 1; i < p.trail.length; i++) {
                                const alpha = (i / p.trail.length) * 0.3;
                                ctx.fillStyle = p.color.replace('%)', `%, ${alpha})`).replace('hsl',
                                    'hsla');
                                ctx.beginPath();
                                ctx.arc(p.trail[i].x, p.trail[i].y, p.size * 0.6, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                    }

                    for (let p of particles) {
                        ctx.shadowBlur = 14;
                        ctx.shadowColor = p.color;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        const r = p.size * (0.75 + 0.45 * Math.sin(timestamp / 800 + p.x * 0.1));
                        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.shadowBlur = 4;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, r * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;

                    for (let s of sparkles) {
                        ctx.fillStyle = `rgba(255,220,240,${s.alpha})`;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = '18px "PingFang SC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(`✨ ${texts[currentPhase]} ✨`, W / 2, H - 50);
                }

                function advancePhase() {
                    if (currentPhase < texts.length - 1) {
                        currentPhase++;
                        setPhaseTargets(currentPhase);
                        if (animId) cancelAnimationFrame(animId);
                        loop();
                    } else {
                        introDone = true;
                        if (animId) cancelAnimationFrame(animId);
                        dom.introOverlay.classList.add('hide');
                        dom.mainCard.style.opacity = '1';
                        musicManager.init();
                        setTimeout(() => {
                            musicManager.tryPlay();
                        }, 500);
                        console.log('✅ 开场动画结束');
                    }
                }

                function loop(timestamp) {
                    if (introDone) return;
                    updateParticles();
                    draw(timestamp || 0);
                    if (phaseFinished) {
                        setTimeout(() => {
                            if (!introDone) advancePhase();
                        }, 700);
                        if (animId) cancelAnimationFrame(animId);
                        setTimeout(() => {
                            if (!introDone) {
                                animId = requestAnimationFrame(loop);
                            }
                        }, 800);
                        return;
                    }
                    animId = requestAnimationFrame(loop);
                }

                function start() {
                    initParticles();
                    setPhaseTargets(0);
                    animId = requestAnimationFrame(loop);
                }

                setTimeout(start, 150);
            })();

            // ============================================================
            // 5. 终极烟花模块
            // ============================================================
            let finalTriggered = false;
            let fwCtx, fwCanvas, fwId;
            let fwParticles = [];
            let fwSparkles = [];

            function triggerFinalAnimation() {
                if (finalTriggered) return;
                finalTriggered = true;
                dom.finalLayer.classList.add('show');
                initFireworks();
            }

            window.closeFinalLayer = function() {
                dom.finalLayer.classList.remove('show');
                cancelFireworks();
            };

            function initFireworks() {
                fwCanvas = dom.fireworkCanvas;
                if (!fwCanvas) return;
                fwCanvas.width = window.innerWidth;
                fwCanvas.height = window.innerHeight;
                fwCtx = fwCanvas.getContext('2d');
                fwParticles = [];
                fwSparkles = [];

                function createExplosion(x, y, hue) {
                    const count = 60 + Math.floor(Math.random() * 50);
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 1.5 + Math.random() * 6;
                        fwParticles.push({
                            x,
                            y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            life: 1,
                            color: `hsl(${hue + Math.random() * 40 - 20}, 90%, ${55 + Math.random() * 30}%)`,
                            size: 2.5 + Math.random() * 5,
                            trail: [],
                        });
                    }
                    for (let i = 0; i < 20; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 2 + Math.random() * 8;
                        fwSparkles.push({
                            x,
                            y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            life: 1,
                            size: 1 + Math.random() * 3,
                        });
                    }
                }

                const hues = [345, 355, 5, 15, 25, 340, 350];
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => {
                        if (!dom.finalLayer.classList.contains('show')) return;
                        createExplosion(
                            Math.random() * fwCanvas.width * 0.8 + fwCanvas.width * 0.1,
                            Math.random() * fwCanvas.height * 0.5 + 40,
                            hues[Math.floor(Math.random() * hues.length)]
                        );
                    }, i * 300);
                }
                let continuousInterval = setInterval(() => {
                    if (!dom.finalLayer.classList.contains('show')) {
                        clearInterval(continuousInterval);
                        return;
                    }
                    createExplosion(
                        Math.random() * fwCanvas.width * 0.8 + fwCanvas.width * 0.1,
                        Math.random() * fwCanvas.height * 0.45 + 30,
                        hues[Math.floor(Math.random() * hues.length)]
                    );
                }, 1200);

                function update() {
                    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
                    fwCtx.fillStyle = 'rgba(0,0,0,0.25)';
                    fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
                    let alive = false;
                    for (let p of fwParticles) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.08;
                        p.vx *= 0.995;
                        p.life -= 0.012;
                        p.trail.push({ x: p.x, y: p.y, life: p.life });
                        if (p.trail.length > 6) p.trail.shift();
                        if (p.life > 0) {
                            alive = true;
                            for (let i = 0; i < p.trail.length; i++) {
                                const t = p.trail[i];
                                const alpha = (i / p.trail.length) * p.life * 0.5;
                                fwCtx.fillStyle = p.color.replace('%)', `%, ${alpha})`).replace('hsl',
                                'hsla');
                                fwCtx.beginPath();
                                fwCtx.arc(t.x, t.y, p.size * 0.5, 0, Math.PI * 2);
                                fwCtx.fill();
                            }
                            fwCtx.globalAlpha = p.life;
                            fwCtx.fillStyle = p.color;
                            fwCtx.shadowBlur = 8;
                            fwCtx.shadowColor = p.color;
                            fwCtx.beginPath();
                            fwCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                            fwCtx.fill();
                        }
                    }
                    for (let s of fwSparkles) {
                        s.x += s.vx;
                        s.y += s.vy;
                        s.vy += 0.05;
                        s.life -= 0.018;
                        if (s.life > 0) {
                            alive = true;
                            fwCtx.globalAlpha = s.life;
                            fwCtx.fillStyle = '#fffde0';
                            fwCtx.shadowBlur = 6;
                            fwCtx.shadowColor = '#ffd700';
                            fwCtx.beginPath();
                            fwCtx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
                            fwCtx.fill();
                        }
                    }
                    fwCtx.globalAlpha = 1;
                    fwCtx.shadowBlur = 0;
                    if (alive || fwSparkles.some(s => s.life > 0) || fwParticles.some(p => p.life > 0)) {
                        fwId = requestAnimationFrame(update);
                    }
                }
                if (fwId) cancelAnimationFrame(fwId);
                update();

                const resizeHandler = () => {
                    if (fwCanvas && dom.finalLayer.classList.contains('show')) {
                        fwCanvas.width = window.innerWidth;
                        fwCanvas.height = window.innerHeight;
                    }
                };
                window.addEventListener('resize', resizeHandler);
                fwCanvas._resizeHandler = resizeHandler;
                fwCanvas._continuousInterval = continuousInterval;
            }

            function cancelFireworks() {
                if (fwId) cancelAnimationFrame(fwId);
                if (fwCtx && fwCanvas) {
                    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
                }
                if (fwCanvas && fwCanvas._continuousInterval) {
                    clearInterval(fwCanvas._continuousInterval);
                }
                if (fwCanvas && fwCanvas._resizeHandler) {
                    window.removeEventListener('resize', fwCanvas._resizeHandler);
                }
                fwParticles = [];
                fwSparkles = [];
            }

            (function generateFloatingHearts() {

            // ============================================================
            // 7. 全局首次触摸监听

            let globalTouchHandled = false;
            document.addEventListener('touchstart', function() {
