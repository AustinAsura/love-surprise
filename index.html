<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no, viewport-fit=cover" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black" name="apple-mobile-web-app-status-bar-style" />
    <meta content="telephone=no" name="format-detection" />
    <title>❤️ 生日快乐，我的宝贝 ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        img { -webkit-touch-callout: none; pointer-events: none; }
        .slide { pointer-events: auto; }

        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --card-radius: 48px;
            --border-width: 3px;
        }

        body {
            min-height: 100vh;
            background: #0a0010;
            font-family: 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
            position: relative;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        #starsCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

        .petals-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .petal {
            position: absolute; top: -60px; animation: petalFall linear forwards;
            filter: drop-shadow(0 0 6px rgba(255, 107, 129, 0.4));
        }
        @keyframes petalFall {
            0% { transform: translateY(-5vh) rotate(0deg) scale(1); opacity: 0; }
            3% { opacity: 0.85; }
            30% { transform: translateY(30vh) rotate(120deg) scale(1.1); opacity: 0.8; }
            60% { transform: translateY(60vh) rotate(250deg) scale(0.9); opacity: 0.55; }
            100% { transform: translateY(105vh) rotate(400deg) scale(0.4); opacity: 0; }
        }

        .click-heart {
            position: fixed; pointer-events: none; z-index: 998;
            animation: clickHeartPop 1.2s ease-out forwards;
            font-size: 28px; filter: drop-shadow(0 0 12px rgba(255, 71, 87, 0.7));
        }
        @keyframes clickHeartPop {
            0% { transform: translate(0,0) scale(0.3) rotate(0deg); opacity: 1; }
            40% { transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(var(--rot)); opacity: 0.9; }
            100% { transform: translate(calc(var(--dx)*2.2), calc(var(--dy)*2.2)) scale(0.15) rotate(calc(var(--rot)*1.6)); opacity: 0; }
        }

        #introOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a0a1a, #050010);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            flex-direction: column; transition: opacity 1.8s ease;
        }
        #introOverlay.hide { opacity: 0; pointer-events: none; }

        .heart-beat {
            position: relative; width: 120px; height: 120px;
            animation: heartBeat 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 107, 129, 0.8));
            margin-bottom: 30px;
        }
        .heart-beat::before, .heart-beat::after {
            content: ''; position: absolute; background: #ff4d6d;
            border-radius: 50px 50px 0 0; width: 60px; height: 90px; top: 15px;
        }
        .heart-beat::before { left: 60px; transform: rotate(-45deg); transform-origin: 0 100%; }
        .heart-beat::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
        .heart-beat .heart-glow {
            position: absolute; top: -20px; left: -20px; width: 160px; height: 160px;
            background: radial-gradient(circle, rgba(255,107,129,0.4) 0%, transparent 70%);
            border-radius: 50%; animation: glowPulse 2s ease-in-out infinite;
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }
        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .intro-love-text {
            color: #fff; font-size: 1.6rem; font-weight: 500; letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 107, 129, 0.7), 0 0 40px rgba(255, 154, 158, 0.5);
            animation: fadeInUp 1.2s ease-out forwards; text-align: center; margin-bottom: 10px; opacity: 0; animation-delay: 0.3s;
        }
        .intro-sub-text {
            color: rgba(255,255,255,0.75); font-size: 1rem; letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255,182,193,0.5);
            animation: fadeInUp 1.2s ease-out forwards; opacity: 0; animation-delay: 0.8s;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .intro-petals { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .intro-petal {
            position: absolute; top: -40px; animation: introPetalFall linear forwards;
            font-size: 24px; opacity: 0.8; filter: drop-shadow(0 0 8px rgba(255,107,129,0.6));
        }
        @keyframes introPetalFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .card-wrapper {
            max-width: 1300px; width: 100%; position: relative; z-index: 2; opacity: 0;
            transition: opacity 1.5s ease; margin: 0 auto;
            padding: var(--border-width); border-radius: calc(var(--card-radius) + var(--border-width));
            background: linear-gradient(45deg, transparent 30%, rgba(255,154,158,0.6) 45%, rgba(251,194,235,0.8) 50%, rgba(255,154,158,0.6) 55%, transparent 70%);
            background-size: 300% 300%; animation: borderSweep 5s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(255,107,129,0.15), 0 0 80px rgba(255,107,129,0.08);
        }
        @keyframes borderSweep {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .birthday-card {
            background: rgba(255,240,245,0.25); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border-radius: var(--card-radius); padding: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.35), inset 0 0 80px rgba(255,182,193,0.08);
            overflow: hidden; animation: cardGlow 4s ease-in-out infinite;
        }
        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 30px 60px rgba(0,0,0,0.35), inset 0 0 80px rgba(255,182,193,0.08); }
            50% { box-shadow: 0 30px 60px rgba(0,0,0,0.35), inset 0 0 120px rgba(255,182,193,0.15); }
        }

        .main-title {
            text-align: center; font-size: 2.6rem; font-weight: 700;
            background: linear-gradient(45deg, #ff6b81, #ff9a9e, #fbc2eb, #ffd1d1);
            background-size: 400% 400%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; animation: gradientShift 3.5s ease-in-out infinite, titleHeartbeat 1.6s ease-in-out infinite;
            margin-bottom: 20px; letter-spacing: 3px; filter: drop-shadow(0 0 18px rgba(255,107,129,0.4)); word-break: break-word;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes titleHeartbeat {
            0%, 100% { transform: scale(1); }
            8% { transform: scale(1.06); }
            16% { transform: scale(1); }
            24% { transform: scale(1.04); }
            32% { transform: scale(1); }
        }

        .content-grid { display: grid; grid-template-columns: 1fr 0.9fr; gap: 20px; align-items: center; }

        .photo-slider {
            background: rgba(255,245,248,0.45); border-radius: 32px; padding: 16px;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.12), inset 0 0 40px rgba(255,200,210,0.2);
            position: relative; overflow: hidden;
        }
        .slider-container {
            position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 24px;
            overflow: hidden; background: #f5e6e8;
            box-shadow: 0 10px 28px rgba(0,0,0,0.18), 0 0 0 3px rgba(255,255,255,0.4); z-index: 2;
        }
        .slider-images { position: relative; width: 100%; height: 100%; }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0;
            transition: opacity 0.7s, transform 0.7s; border-radius: 24px; object-fit: cover; transform: scale(0.94);
        }
        .slide.active { opacity: 1; transform: scale(1); }

        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px;
            background: rgba(255,255,255,0.9); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%;
            cursor: pointer; font-size: 28px; font-weight: bold; color: #ff6b81;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15); z-index: 10; touch-action: manipulation;
        }
        .slider-btn.prev { left: 8px; }
        .slider-btn.next { right: 8px; }

        .slider-dots { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
        .dot {
            width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,0.55);
            cursor: pointer; transition: 0.4s;
        }
        .dot.active { width: 28px; border-radius: 7px; background: #ff4757; box-shadow: 0 0 16px rgba(255,71,87,0.5); }

        .love-quotes {
            background: rgba(255,248,245,0.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-radius: 32px; padding: 30px 22px; text-align: center;
            box-shadow: 0 14px 32px rgba(0,0,0,0.1); min-height: 400px;
            display: flex; flex-direction: column; justify-content: center;
            border: 1px solid rgba(255,255,255,0.5); position: relative; overflow: hidden;
        }
        .quote-icon { font-size: 44px; margin-bottom: 18px; animation: iconFloat 3s ease-in-out infinite; }
        @keyframes iconFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .quote-text {
            font-size: 1.35rem; line-height: 1.6; color: #2c3e50; font-weight: 500;
            letter-spacing: 1.5px; text-shadow: 0 1px 3px rgba(255,255,255,0.6);
        }
        .quote-text.typing { border-right: 2px solid #ff6b81; animation: cursorBlink 0.7s step-end infinite; }
        @keyframes cursorBlink { 0%, 100% { border-color: #ff6b81; } 50% { border-color: transparent; } }
        .quote-author { margin-top: 26px; color: #ff6b81; font-weight: 600; letter-spacing: 2px; }

        .music-control { margin-top: 20px; display: flex; align-items: center; gap: 10px; }
        .progress-bar {
            flex: 1; -webkit-appearance: none; height: 5px; border-radius: 5px;
            background: rgba(255,107,129,0.3); cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: #ff6b81; box-shadow: 0 0 14px rgba(255,107,129,0.5); border: 3px solid #fff;
        }
        .time-display { font-size: 0.7rem; color: #888; min-width: 70px; }

        .heart-canvas-wrapper { margin-top: 26px; text-align: center; border-radius: 22px; overflow: hidden; }
        #heartCanvas { max-width: 100%; border-radius: 22px; background: rgba(255,240,245,0.35); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }

        .final-animation-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px); z-index: 999; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: 0.6s; flex-direction: column;
        }
        .final-animation-layer.show { opacity: 1; visibility: visible; }
        .final-blessing { text-align: center; color: white; padding: 24px; }
        .final-blessing h1 { font-size: 2.2rem; text-shadow: 0 0 24px #ff6b81; animation: glowPulse 1.5s infinite; }
        .close-final {
            margin-top: 36px; padding: 14px 32px; background: linear-gradient(135deg, #ff6b81, #ff4757);
            border: none; border-radius: 50px; color: white; font-size: 1rem; cursor: pointer;
        }

        .floating-hearts { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .heart-bg {
            position: absolute; font-size: 20px; opacity: 0.35; animation: floatHeart 9s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255,150,170,0.5));
        }
        @keyframes floatHeart {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            8% { opacity: 0.35; }
            100% { transform: translateY(-25vh) rotate(380deg); opacity: 0; }
        }

        @media (max-width: 768px) {
            :root { --card-radius: 36px; --border-width: 2px; }
            body { padding: calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left)); }
            .birthday-card { padding: 18px; }
            .content-grid { grid-template-columns: 1fr; gap: 16px; }
            .main-title { font-size: 2rem; }
            .quote-text { font-size: 1.2rem; }
            .love-quotes { min-height: 280px; padding: 24px 16px; border-radius: 28px; }
            .photo-slider { border-radius: 28px; padding: 12px; }
            .slider-container { border-radius: 20px; }
            .slide { border-radius: 20px; }
            .slider-btn { width: 42px; height: 42px; font-size: 26px; }
            .heart-beat { width: 100px; height: 100px; }
            .heart-beat::before, .heart-beat::after { width: 50px; height: 75px; }
            .heart-beat::before { left: 50px; }
            .heart-canvas-wrapper { border-radius: 16px; }
            #heartCanvas { border-radius: 16px; }
        }
        @media (max-width: 430px) {
            :root { --card-radius: 32px; }
            .main-title { font-size: 1.7rem; }
            .slider-btn { width: 38px; height: 38px; font-size: 22px; }
            .heart-beat { width: 80px; height: 80px; }
            .heart-beat::before, .heart-beat::after { width: 40px; height: 60px; }
            .heart-beat::before { left: 40px; }
            .intro-love-text { font-size: 1.3rem; }
            .intro-sub-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <canvas id="starsCanvas"></canvas>
    <div class="petals-container" id="petalsContainer"></div>

    <div id="introOverlay">
        <div class="intro-petals" id="introPetals"></div>
        <div class="heart-beat"><div class="heart-glow"></div></div>
        <div class="intro-love-text">遇见你，是今生最美的意外</div>
        <div class="intro-sub-text">💕 生日快乐，我的宝贝 💕</div>
    </div>

    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="card-wrapper" id="cardWrapper">
        <div class="birthday-card">
            <div class="main-title">🎂 祝宝贝生日快乐 🎂</div>
            <div class="content-grid">
                <div class="photo-slider">
                    <div class="slider-container">
                        <div class="slider-images" id="sliderImages"></div>
                        <button class="slider-btn prev" id="prevBtn">‹</button>
                        <button class="slider-btn next" id="nextBtn">›</button>
                    </div>
                    <div class="slider-dots" id="sliderDots"></div>
                </div>
                <div class="love-quotes">
                    <div class="quote-icon">🌸💖🌸</div>
                    <div class="quote-text" id="quoteText">爱你是最美的冒险</div>
                    <div class="quote-author">— To My Love —</div>
                    <div class="music-control">
                        <div class="progress-container">
                            <input type="range" class="progress-bar" id="musicProgress" value="0" step="0.01" />
                            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="heart-canvas-wrapper">
                <canvas id="heartCanvas" width="400" height="300"></canvas>
            </div>
        </div>
    </div>

    <div class="final-animation-layer" id="finalLayer">
        <canvas id="fireworkCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>
        <div class="final-blessing">
            <h1>❤️ 年年岁岁，岁岁年年 ❤️</h1>
            <p>爱你的我永远陪在你身边<br />生日快乐，我亲爱的宝贝</p>
            <button class="close-final" onclick="closeFinalLayer()">✨ 永远爱你 ✨</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            const CONFIG = {
                musicFile: 'a_thousand_years.mp3',
                photos: ['photo1.jpg','photo2.jpg','photo3.jpg','photo4.jpg','photo5.jpg','photo6.jpg',
                         'photo7.jpg','photo8.jpg','photo9.jpg','photo10.jpg','photo11.jpg','photo12.jpg',
                         'photo13.jpg','photo14.jpg'],
                quotes: ['💕 我们的故事，从那一刻开始，就注定浪漫','🌟 你的微笑是全世界最美的风景',
                         '🎀 你让平凡的日子都闪着光','🍬 你比糖果还要甜，比阳光还要暖',
                         '✨ 遇见你是我最大的幸运','💖 和你在一起的每个瞬间都值得珍藏',
                         '🌸 你是我心动的唯一理由','🌈 世界万物，你是我的欢喜',
                         '🌹 和你一起，连空气都是甜的','🍁 所有的美好，都与你有关',
                         '🌟 我的世界因你而完整','🎈 你是心动，是偏爱，是例外',
                         '💝 爱你这件事，我从未动摇','🎂 宝贝，生日快乐，今天你是全世界最幸福的女孩']
            };
            const $ = id => document.getElementById(id);
            const dom = {
                starsCanvas: $('starsCanvas'),
                petalsContainer: $('petalsContainer'),
                introOverlay: $('introOverlay'),
                introPetals: $('introPetals'),
                cardWrapper: $('cardWrapper'),
                sliderImages: $('sliderImages'),
                sliderDots: $('sliderDots'),
                prevBtn: $('prevBtn'),
                nextBtn: $('nextBtn'),
                quoteText: $('quoteText'),
                musicProgress: $('musicProgress'),
                timeDisplay: $('timeDisplay'),
                heartCanvas: $('heartCanvas'),
                finalLayer: $('finalLayer'),
                fireworkCanvas: $('fireworkCanvas'),
                floatingHearts: $('floatingHearts')
            };

            function formatTime(s) {
                if (!s || !isFinite(s)) return '0:00';
                const m = Math.floor(s / 60);
                return `${m}:${Math.floor(s % 60).toString().padStart(2, '0')}`;
            }
            const isWechat = /MicroMessenger/i.test(navigator.userAgent);
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            // 星空
            (function() {
                const c = dom.starsCanvas, ctx = c.getContext('2d');
                let w, h, stars = [];
                function resize() { w = window.innerWidth; h = window.innerHeight; c.width = w; c.height = h; }
                resize(); window.addEventListener('resize', resize);
                for (let i=0; i<180; i++) stars.push({ x: Math.random()*w, y: Math.random()*h, r: 0.4+Math.random()*2.2, s: 0.005+Math.random()*0.03, o: Math.random()*Math.PI*2, a: 0.3+Math.random()*0.7, cl: Math.random()<0.15?`hsl(${Math.random()*30+340},80%,${70+Math.random()*25}%)`:`hsl(${Math.random()*60+200},30%,${75+Math.random()*20}%)` });
                function animate(t) {
                    ctx.clearRect(0,0,w,h);
                    for (let s of stars) {
                        const alpha = s.a*(0.55+0.45*Math.sin(t*s.s+s.o));
                        ctx.fillStyle = s.cl; ctx.globalAlpha = alpha; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,2*Math.PI); ctx.fill();
                        if (s.r>1.5&&alpha>0.7) { ctx.globalAlpha = alpha*0.25; ctx.beginPath(); ctx.arc(s.x,s.y,s.r*3.5,0,2*Math.PI); ctx.fill(); }
                    }
                    ctx.globalAlpha = 1; requestAnimationFrame(animate);
                }
                requestAnimationFrame(animate);
            })();

            // 花瓣飘落
            function createPetal(container) {
                const p = document.createElement('span'); p.className = 'petal';
                p.textContent = ['🌸','🌷','💮','🌺','✿'][Math.floor(Math.random()*5)];
                p.style.left = Math.random()*96+'%'; p.style.fontSize = (18+Math.random()*28)+'px';
                p.style.animationDuration = (7+Math.random()*11)+'s'; container.appendChild(p);
                setTimeout(() => p.remove(), 14000);
            }
            setInterval(() => { if(dom.petalsContainer.children.length<18) createPetal(dom.petalsContainer); }, 900);
            for (let i=0;i<12;i++) createPetal(dom.petalsContainer);
            // 开场花瓣
            for (let i=0;i<15;i++) {
                const p = document.createElement('span'); p.className = 'intro-petal';
                p.textContent = ['🌸','💖','🌷','✨'][Math.floor(Math.random()*4)];
                p.style.left = Math.random()*100+'%'; p.style.animationDuration = (3+Math.random()*4)+'s';
                p.style.animationDelay = Math.random()*2+'s'; dom.introPetals.appendChild(p);
            }

            // 点击爱心
            function spawnClickHeart(x,y) {
                for (let i=0;i<4+Math.floor(Math.random()*5);i++) {
                    const el = document.createElement('span'); el.className = 'click-heart';
                    el.textContent = ['❤️','💖','💗','💓','💕','💝'][Math.floor(Math.random()*6)];
                    el.style.left = x+'px'; el.style.top = y+'px'; el.style.fontSize = (20+Math.random()*22)+'px';
                    const angle = Math.random()*2*Math.PI, dist = 40+Math.random()*80;
                    el.style.setProperty('--dx', Math.cos(angle)*dist+'px'); el.style.setProperty('--dy', Math.sin(angle)*dist-30-Math.random()*50+'px');
                    el.style.setProperty('--rot', (Math.random()-0.5)*180+'deg');
                    document.body.appendChild(el); setTimeout(() => el.remove(), 1400);
                }
            }
            document.addEventListener('click', e => {
                if (e.target.closest('button')||e.target.closest('input')||e.target.closest('.dot')) return;
                if (dom.finalLayer.classList.contains('show')) return;
                spawnClickHeart(e.clientX, e.clientY);
                musicManager.tryPlay();
            });
            document.addEventListener('touchstart', e => {
                if (e.target.closest('button')||e.target.closest('input')||e.target.closest('.dot')) return;
                if (dom.finalLayer.classList.contains('show')) return;
                if (e.touches.length===1) spawnClickHeart(e.touches[0].clientX, e.touches[0].clientY);
                musicManager.tryPlay();
            }, {passive: true});

            // 音乐管理器
            const musicManager = (function() {
                let audio = null, ready = false, playing = false, playAttempted = false, unlocked = false;
                function init() {
                    if (audio) return audio;
                    audio = document.createElement('audio'); audio.loop = true; audio.preload = 'auto';
                    audio.src = encodeURI(CONFIG.musicFile); audio.volume = 0.7; document.body.appendChild(audio);
                    audio.addEventListener('canplaythrough', () => { ready = true; if(playAttempted&&!playing) attemptPlay(); });
                    audio.addEventListener('loadedmetadata', () => { if(audio.duration) updateTimeDisplay(0,audio.duration); });
                    audio.addEventListener('timeupdate', () => { if(!isSeeking&&audio.duration) { dom.musicProgress.value = (audio.currentTime/audio.duration)*100; updateTimeDisplay(audio.currentTime, audio.duration); } });
                    audio.addEventListener('play', () => { playing = true; });
                    audio.addEventListener('pause', () => { playing = false; });
                    audio.addEventListener('error', () => console.warn('音乐加载失败'));
                    audio.load();
                    if (isWechat) {
                        if (typeof WeixinJSBridge !== 'undefined') WeixinJSBridge.invoke('getNetworkType',{},()=>{ if(audio&&ready) audio.play().then(()=>{audio.pause();audio.currentTime=0;playing=false;unlocked=true;}).catch(()=>{}); });
                        document.addEventListener('WeixinJSBridgeReady', () => WeixinJSBridge.invoke('getNetworkType',{},()=>{ if(audio&&ready) audio.play().then(()=>{audio.pause();audio.currentTime=0;playing=false;unlocked=true;}).catch(()=>{}); }));
                    }
                    return audio;
                }
                function attemptPlay() {
                    if (!audio) audio = init();
                    if (!audio || playing) return;
                    playAttempted = true;
                    audio.play().then(() => { playing = true; unlocked = true; }).catch(err => {
                        if (err.name === 'NotAllowedError' && isIOS && !unlocked) {
                            const h = () => { if(unlocked) return document.removeEventListener('touchstart',h); audio.play().then(()=>{audio.pause();audio.currentTime=0;playing=false;unlocked=true;setTimeout(attemptPlay,100);}).catch(()=>{}); };
                            document.addEventListener('touchstart', h, {passive: true});
                        }
                    });
                }
                function tryPlay() { if (!playing) attemptPlay(); }
                function getAudio() { return audio; }
                init(); return { tryPlay, getAudio };
            })();

            let isSeeking = false;
            function updateTimeDisplay(cur, dur) { dom.timeDisplay.textContent = `${formatTime(cur)} / ${formatTime(dur)}`; }
            function setupProgress() {
                const p = dom.musicProgress;
                p.addEventListener('input', function() { isSeeking=true; const a=musicManager.getAudio(); if(a&&a.duration) updateTimeDisplay((this.value/100)*a.duration, a.duration); });
                p.addEventListener('change', function() { isSeeking=false; const a=musicManager.getAudio(); if(a) a.currentTime = (this.value/100)*a.duration; });
                p.addEventListener('touchend', function() { isSeeking=false; const a=musicManager.getAudio(); if(a) a.currentTime = (this.value/100)*a.duration; });
                p.addEventListener('click', e => { e.stopPropagation(); musicManager.tryPlay(); });
            }
            setupProgress();

            // 爱心粒子
            (function() {
                const c = dom.heartCanvas, ctx = c.getContext('2d');
                let w, h, particles = [], heartPoints = [];
                function resize() { const r = c.parentElement.getBoundingClientRect(); w = Math.min(r.width*0.9,500); h = w*0.75; c.width = w; c.height = h; }
                resize(); window.addEventListener('resize', resize);
                function genHeart() {
                    const pts = [], scale = Math.min(w,h)*0.4, cx = w/2, cy = h/2-6;
                    for (let t=0; t<=2*Math.PI; t+=0.06) {
                        const x = 16*Math.pow(Math.sin(t),3), y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
                        pts.push({ x: cx+x*scale/16, y: cy-y*scale/16 });
                    }
                    return pts;
                }
                class Particle {
                    constructor(x,y,vx,vy,size,alpha,hue) { this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.size=size; this.alpha=alpha; this.gravity=0.04; this.hue=hue||350+Math.random()*20; }
                    update() { this.x+=this.vx; this.y+=this.vy; this.vy+=this.gravity; this.alpha-=0.007; this.hue+=0.3; return this.alpha>0; }
                    draw(ctx,t) {
                        ctx.save(); ctx.shadowBlur=10; ctx.shadowColor=`hsla(${this.hue},80%,65%,0.5)`; ctx.globalAlpha=this.alpha;
                        ctx.fillStyle = `hsl(${this.hue},80%,${60+Math.sin(t*0.005+this.x)*10}%)`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,2*Math.PI); ctx.fill();
                        ctx.globalAlpha=this.alpha*0.7; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size*0.35,0,2*Math.PI); ctx.fill(); ctx.restore();
                    }
                }
                function init() { heartPoints = genHeart(); particles = []; for (let i=0;i<450;i++) { const b=heartPoints[Math.floor(Math.random()*heartPoints.length)], a=Math.random()*2*Math.PI, s=0.5+Math.random()*1.4; particles.push(new Particle(b.x,b.y,Math.cos(a)*s,Math.sin(a)*s-1,1.8+Math.random()*4.5,0.9,345+Math.random()*25)); } }
                function animate(t) {
                    ctx.clearRect(0,0,w,h); ctx.save(); ctx.globalAlpha=0.15+0.06*Math.sin(t*0.002); ctx.fillStyle='#ffb0c0'; ctx.beginPath();
                    if (heartPoints.length) { ctx.moveTo(heartPoints[0].x,heartPoints[0].y); for (let i=1;i<heartPoints.length;i++) ctx.lineTo(heartPoints[i].x,heartPoints[i].y); ctx.closePath(); ctx.fill(); ctx.shadowBlur=30; ctx.shadowColor='#ff8090'; ctx.fill(); } ctx.restore();
                    for (let i=particles.length-1;i>=0;i--) { if (!particles[i].update()) { const b=heartPoints[Math.floor(Math.random()*heartPoints.length)], a=Math.random()*2*Math.PI, s=0.4+Math.random()*1.1; particles[i]=new Particle(b.x,b.y,Math.cos(a)*s,Math.sin(a)*s-0.7,1.6+Math.random()*4,0.85,345+Math.random()*25); } particles[i].draw(ctx,t); }
                    requestAnimationFrame(animate);
                }
                init(); requestAnimationFrame(animate);
            })();

            // 轮播
            let currentIndex = 0, typingTimer = null;
            function buildSlider() {
                dom.sliderImages.innerHTML = CONFIG.photos.map((s,i) => `<img src="${s}" class="slide${i===0?' active':''}" onerror="this.src='https://via.placeholder.com/500x500/ffe0e5/ff6b81?text=💖+Love+Memory+💖'">`).join('');
                dom.sliderDots.innerHTML = CONFIG.photos.map((_,i) => `<div class="dot${i===0?' active':''}"></div>`).join('');
                document.querySelectorAll('.dot').forEach((d,i) => d.addEventListener('click', () => { goToSlide(i); musicManager.tryPlay(); }));
            }
            function typewriter(text, el, speed=35) {
                if (typingTimer) clearTimeout(typingTimer);
                el.classList.add('typing'); el.textContent = ''; let i=0;
                function type() { if(i<text.length) { el.textContent += text[i]; i++; typingTimer = setTimeout(type, speed); } else { el.classList.remove('typing'); typingTimer=null; } }
                type();
            }
            function updateSlide(i, useTypewriter=false) {
                document.querySelectorAll('.slide').forEach((s,idx) => s.classList.toggle('active', idx===i));
                document.querySelectorAll('.dot').forEach((d,idx) => d.classList.toggle('active', idx===i));
                const text = CONFIG.quotes[i]||'';
                if (useTypewriter && i!==0) typewriter(text, dom.quoteText);
                else { if(typingTimer) clearTimeout(typingTimer); dom.quoteText.classList.remove('typing'); dom.quoteText.style.opacity='0'; setTimeout(() => { dom.quoteText.textContent=text; dom.quoteText.style.opacity='1'; }, 180); }
            }
            function goToSlide(i) {
                if (i<0) i=CONFIG.photos.length-1;
                if (i>=CONFIG.photos.length) { triggerFinal(); return; }
                currentIndex = i; updateSlide(i, true); musicManager.tryPlay();
            }
            function nextSlide() { goToSlide(currentIndex+1); }
            function prevSlide() { goToSlide(currentIndex-1); }
            dom.prevBtn.addEventListener('click', e => { e.stopPropagation(); prevSlide(); musicManager.tryPlay(); });
            dom.nextBtn.addEventListener('click', e => { e.stopPropagation(); nextSlide(); musicManager.tryPlay(); });
            document.addEventListener('keydown', e => { if(e.key==='ArrowLeft') prevSlide(); if(e.key==='ArrowRight') nextSlide(); });

            // 烟花
            let finalTriggered = false, fwCtx, fwCanvas, fwId, fwParticles=[], fwSparkles=[];
            function triggerFinal() { if(finalTriggered) return; finalTriggered=true; dom.finalLayer.classList.add('show'); initFireworks(); }
            window.closeFinalLayer = () => { dom.finalLayer.classList.remove('show'); cancelFireworks(); };
            function initFireworks() {
                fwCanvas = dom.fireworkCanvas; fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight;
                fwCtx = fwCanvas.getContext('2d'); fwParticles = []; fwSparkles = [];
                function createExplosion(x,y,hue) {
                    for (let i=0;i<80;i++) { const a=Math.random()*2*Math.PI, s=1.5+Math.random()*6; fwParticles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:`hsl(${hue+Math.random()*40-20},90%,${55+Math.random()*30}%)`,size:2.5+Math.random()*5,trail:[]}); }
                    for (let i=0;i<20;i++) { const a=Math.random()*2*Math.PI, s=2+Math.random()*8; fwSparkles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,size:1+Math.random()*3}); }
                }
                const hues=[345,355,5,15,25,340,350];
                for (let i=0;i<10;i++) setTimeout(() => { if(!dom.finalLayer.classList.contains('show')) return; createExplosion(Math.random()*fwCanvas.width*0.8+fwCanvas.width*0.1,Math.random()*fwCanvas.height*0.5+40,hues[Math.floor(Math.random()*hues.length)]); }, i*300);
                let interval = setInterval(() => { if(!dom.finalLayer.classList.contains('show')) { clearInterval(interval); return; } createExplosion(Math.random()*fwCanvas.width*0.8+fwCanvas.width*0.1,Math.random()*fwCanvas.height*0.45+30,hues[Math.floor(Math.random()*hues.length)]); }, 1200);
                function update() {
                    fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height); fwCtx.fillStyle='rgba(0,0,0,0.25)'; fwCtx.fillRect(0,0,fwCanvas.width,fwCanvas.height);
                    let alive=false;
                    for (let p of fwParticles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.vx*=0.995; p.life-=0.012; p.trail.push({x:p.x,y:p.y}); if(p.trail.length>6) p.trail.shift(); if(p.life>0) { alive=true; for (let i=0;i<p.trail.length;i++) { const t=p.trail[i]; fwCtx.fillStyle=p.color.replace('%)',`, ${(i/p.trail.length)*p.life*0.5})`).replace('hsl','hsla'); fwCtx.beginPath(); fwCtx.arc(t.x,t.y,p.size*0.5,0,2*Math.PI); fwCtx.fill(); } fwCtx.globalAlpha=p.life; fwCtx.fillStyle=p.color; fwCtx.shadowBlur=8; fwCtx.shadowColor=p.color; fwCtx.beginPath(); fwCtx.arc(p.x,p.y,p.size*p.life,0,2*Math.PI); fwCtx.fill(); } }
                    for (let s of fwSparkles) { s.x+=s.vx; s.y+=s.vy; s.vy+=0.05; s.life-=0.018; if(s.life>0) { alive=true; fwCtx.globalAlpha=s.life; fwCtx.fillStyle='#fffde0'; fwCtx.shadowBlur=6; fwCtx.shadowColor='#ffd700'; fwCtx.beginPath(); fwCtx.arc(s.x,s.y,s.size*s.life,0,2*Math.PI); fwCtx.fill(); } }
                    fwCtx.globalAlpha=1; fwCtx.shadowBlur=0;
                    if (alive) fwId = requestAnimationFrame(update);
                }
                update();
            }
            function cancelFireworks() { if(fwId) cancelAnimationFrame(fwId); if(fwCtx) fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height); fwParticles=[]; fwSparkles=[]; }

            // 浮动爱心背景
            setInterval(() => {
                const el = document.createElement('div'); el.className = 'heart-bg';
                el.textContent = ['❤️','💖','💗','💓','💕','🌸','✨'][Math.floor(Math.random()*7)];
                el.style.left = Math.random()*95+'%'; el.style.fontSize = (14+Math.random()*28)+'px';
                el.style.animationDuration = (6+Math.random()*10)+'s'; dom.floatingHearts.appendChild(el);
                setTimeout(() => el.remove(), 13000);
            }, 700);

            // 初始化
            buildSlider();
            updateSlide(0);
            setTimeout(() => {
                dom.introOverlay.classList.add('hide');
                dom.cardWrapper.style.opacity = '1';
                musicManager.tryPlay();
            }, 4500);
        })();
    </script>
</body>
</html>
